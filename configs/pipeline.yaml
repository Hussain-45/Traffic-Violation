# Centralized AI Pipeline Configuration

# Global settings
debug_mode: true
logging_level: "INFO"

# Execution order of pipeline modules
execution_order:
  - "vehicle_detection"
  - "vehicle_tracking"
  - "helmet_detection"
  - "seat_belt_detection"
  - "phone_detection"
  - "traffic_signal_detection"
  - "wrong_side_detection"
  - "triple_riding_detection"
  - "number_plate_detection"
  - "ocr"
  - "violation_engine"

# Dynamic AI Modules activation state and parameters
modules:
  vehicle_detection:
    enabled: true
    confidence_threshold: 0.45
  vehicle_tracking:
    enabled: true
    confidence_threshold: 0.45
  helmet_detection:
    enabled: true
    confidence_threshold: 0.50
  seat_belt_detection:
    enabled: true
    confidence_threshold: 0.50
  phone_detection:
    enabled: true
    confidence_threshold: 0.50
  traffic_signal_detection:
    enabled: true
    confidence_threshold: 0.50
  wrong_side_detection:
    enabled: true
    confidence_threshold: 0.50
    minimum_track_age: 10
    minimum_distance: 30.0
    minimum_angle_difference: 135.0
    minimum_history: 5
    minimum_motion_confidence: 0.70
    consecutive_confirmations: 3
  rider_association:
    minimum_iou: 0.15
    maximum_distance: 150.0
    association_score_threshold: 0.40
    minimum_confidence: 0.50
    maximum_passengers: 3
  triple_riding_detection:
    enabled: true
    confidence_threshold: 0.50
    minimum_association_confidence: 0.60
    minimum_visible_riders: 1
    minimum_track_age: 5
    confirmation_frames: 3
    maximum_riders: 2
  plate_association:
    minimum_plate_confidence: 0.50
    minimum_association_score: 0.35
    minimum_history_length: 3
    stable_confirmation_frames: 5
    maximum_plate_distance: 150.0
    association_weights:
      overlap: 0.60
      distance: 0.40
  number_plate_detection:
    enabled: true
    confidence_threshold: 0.50
    minimum_plate_confidence: 0.50
    minimum_crop_width: 30
    minimum_crop_height: 10
    minimum_visibility: 0.10
    minimum_crop_sharpness: 10.0
    minimum_aspect_ratio: 1.5
    maximum_aspect_ratio: 6.5
    association_score: 0.35
    stable_confirmation_frames: 5
  plate_recognition:
    minimum_ocr_confidence: 0.50
    minimum_votes: 3
    minimum_history: 3
    minimum_validation_score: 0.60
    maximum_history: 15
    normalization_rules: true
  ocr:
    enabled: true
    ocr_engine: "easyocr"
    confidence_threshold: 0.50
    minimum_ocr_confidence: 0.50
    maximum_crop_rotation: 15.0
    batch_size: 4
    gpu: false
    language: "en"
  violation_engine:
    enabled: false
    confidence_threshold: 0.50

# Visualization Options
visualization:
  draw_boxes: true
  draw_ids: true
  draw_labels: true
  draw_roi: true
  draw_trails: false
  draw_heatmap: false
