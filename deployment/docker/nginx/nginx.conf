user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging templates
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # 1. Rate Limiting setup (10 requests per second with burst size limit)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # 2. Gzip Compression setup
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Upstream backend
    upstream backend_servers {
        server backend:8000;
    }

    # Upstream frontend
    upstream frontend_servers {
        server frontend:80;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name localhost;

        # Redirect HTTP traffic to HTTPS (Template prepared for local cert mappings)
        # listen 443 ssl;
        # ssl_certificate /etc/nginx/certs/stvds.crt;
        # ssl_certificate_key /etc/nginx/certs/stvds.key;
        # ssl_protocols TLSv1.2 TLSv1.3;

        client_max_body_size 100M; # Supports large video files uploads

        # Security response headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Content-Security-Policy "default-src 'self' http://localhost:8000; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: http://localhost:8000; connect-src 'self' ws://localhost:8000 http://localhost:8000;" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # 3. Route API endpoints
        location /api/v1/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://backend_servers;
            proxy_http_version 1.1;
            
            # WebSocket support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Request passing headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # 4. Route uploaded static evidence files
        location /data/ {
            proxy_pass http://backend_servers;
            expires 7d;
            add_header Cache-Control "public, no-transform";
        }

        # 5. Route Web Frontend
        location / {
            proxy_pass http://frontend_servers;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            expires 1d;
            add_header Cache-Control "public, must-revalidate, proxy-revalidate";
        }
    }
}
