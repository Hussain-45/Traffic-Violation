version: '3.8'

services:
  # 🐍 FastAPI backend service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stvds-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/workspace/data
      - ./backend/stvds_backend.log:/workspace/stvds_backend.log
    environment:
      - PROJECT_NAME=Smart Traffic System
      - UPLOAD_DIR=data/uploads
      - ACTIVE_AI_AVAILABLE=False # Fallback simulation in container unless weights provided
    restart: always

  # ⚛️ React Nginx frontend service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stvds-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: always
